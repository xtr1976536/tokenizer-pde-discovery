[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tokenizer-pde-discovery"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "sympy", "openpyxl", "matplotlib", "tqdm", "torch", "tokenizers", "sentencepiece", "tiktoken", "requests"]
[project.optional-dependencies]
test = ["pytest"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
